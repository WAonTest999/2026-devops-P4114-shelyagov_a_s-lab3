apiVersion: batch/v1
kind: Job
metadata: { name: school-load, namespace: school }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 420
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:1.0.0
          args: [run, /scripts/load.js]
          resources: { requests: { cpu: 250m, memory: 128Mi }, limits: { cpu: '2', memory: 512Mi } }
          volumeMounts: [{ name: script, mountPath: /scripts }]
      volumes: [{ name: script, configMap: { name: load-script } }]
