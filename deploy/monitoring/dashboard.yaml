apiVersion: v1
kind: ConfigMap
metadata:
  name: school-dashboard
  namespace: monitoring
  labels: { grafana_dashboard: "1" }
data:
  school.json: |
    {
      "uid": "music-school",
      "title": "Music School",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Prometheus", "value": "prometheus" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Backend pods (HPA)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available{namespace=\"school\",deployment=\"backend\"}",
              "legendFormat": "Available"
            },
            {
              "refId": "B",
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"school\",horizontalpodautoscaler=\"backend\"}",
              "legendFormat": "HPA desired"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0 }, "overrides": [] }
        },
        {
          "id": 2,
          "title": "Backend CPU",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"school\",container=\"backend\"}[1m]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 3,
          "title": "HTTP requests per minute",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(school_http_requests_total{namespace=\"school\"}[1m])) * 60",
              "legendFormat": "RPM"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 4,
          "title": "HTTP latency p95",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(school_http_request_duration_seconds_bucket{namespace=\"school\"}[5m])))",
              "legendFormat": "p95"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] }
        }
      ]
    }
